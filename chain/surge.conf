# Surge 配置模板（chain）
# 由 Sub-Store 文件功能拉取，scripts/surge-template.js 负责写入节点
# 规则来自 Loyalsoldier/surge-rules，结构参考 Repcz/Tool
# 需要 Surge iOS 5.22.0 或更高版本

[General]
loglevel = notify
internet-test-url = http://wifi.vivo.com.cn/generate_204
proxy-test-url = http://cp.cloudflare.com/generate_204
test-timeout = 5
dns-server = 223.5.5.5, 119.29.29.29
encrypted-dns-server = https://dns.alidns.com/dns-query, https://doh.pub/dns-query
hijack-dns = *:53
ipv6 = false
skip-proxy = 127.0.0.1, localhost, *.local
exclude-simple-hostnames = true
geoip-maxmind-url = https://raw.githubusercontent.com/Loyalsoldier/geoip/release/Country-without-asn.mmdb

[Proxy]

[Proxy Group]
🧭 机场节点 = select, __AIRPORT_NODES__
🔗 前置节点 = select, 🇭🇰 香港, 🇹🇼 台湾, 🇸🇬 新加坡, 🇯🇵 日本, 🇰🇷 韩国, 🇺🇸 美国, 🌐 其他国家
🚀 落地节点 = select, __LANDING_NODES__, underlying-proxy=🔗 前置节点
🇭🇰 香港 = select, include-other-group=🧭 机场节点, policy-regex-filter=(?i)🇭🇰|香港|港|\bHK\b|Hong
🇹🇼 台湾 = select, include-other-group=🧭 机场节点, policy-regex-filter=(?i)🇹🇼|台湾|台|\bTW\b|Taiwan
🇸🇬 新加坡 = select, include-other-group=🧭 机场节点, policy-regex-filter=(?i)🇸🇬|新加坡|狮城|\bSG\b|Singapore
🇯🇵 日本 = select, include-other-group=🧭 机场节点, policy-regex-filter=(?i)🇯🇵|日本|东京|大阪|\bJP\b|Japan
🇰🇷 韩国 = select, include-other-group=🧭 机场节点, policy-regex-filter=(?i)🇰🇷|韩国|首尔|\bKR\b|Korea
🇺🇸 美国 = select, include-other-group=🧭 机场节点, policy-regex-filter=(?i)🇺🇸|美国|洛杉矶|圣何塞|\bUS\b|United States
🌐 其他国家 = select, include-other-group=🧭 机场节点, policy-regex-filter=(?i)^(?!.*(🇭🇰|香港|港|\bHK\b|Hong|🇹🇼|台湾|台|\bTW\b|Taiwan|🇸🇬|新加坡|狮城|\bSG\b|Singapore|🇯🇵|日本|东京|大阪|\bJP\b|Japan|🇰🇷|韩国|首尔|\bKR\b|Korea|🇺🇸|美国|洛杉矶|圣何塞|\bUS\b|United States|剩余|流量|到期|过期|官网|套餐)).*$

[Rule]
DOMAIN-SET,https://cdn.jsdelivr.net/gh/Loyalsoldier/surge-rules@release/private.txt,DIRECT
RULE-SET,SYSTEM,DIRECT
DOMAIN-SET,https://cdn.jsdelivr.net/gh/Loyalsoldier/surge-rules@release/icloud.txt,DIRECT
DOMAIN-SET,https://cdn.jsdelivr.net/gh/Loyalsoldier/surge-rules@release/apple.txt,DIRECT
DOMAIN-SET,https://cdn.jsdelivr.net/gh/Loyalsoldier/surge-rules@release/proxy.txt,🚀 落地节点,force-remote-dns
DOMAIN-SET,https://cdn.jsdelivr.net/gh/Loyalsoldier/surge-rules@release/direct.txt,DIRECT
RULE-SET,https://cdn.jsdelivr.net/gh/Loyalsoldier/surge-rules@release/telegramcidr.txt,🚀 落地节点,no-resolve
RULE-SET,https://cdn.jsdelivr.net/gh/Loyalsoldier/surge-rules@release/cncidr.txt,DIRECT
RULE-SET,LAN,DIRECT
GEOIP,CN,DIRECT
FINAL,🚀 落地节点,dns-failed
